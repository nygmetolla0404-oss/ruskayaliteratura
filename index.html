<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Қазақстанда туған орыс әдебиеті · Русская литература, рождённая в Казахстане</title>
<meta name="description" content="Интерактивный образовательный сайт: 3D-карта Казахстана, виртуальный музей, аудиогиды на казахском и русском языках, буктрейлеры и задания.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0f1e'/%3E%3Cg fill='none' stroke='%23e3b55b' stroke-width='4' stroke-linecap='round'%3E%3Cpath d='M32 54V30'/%3E%3Cpath d='M32 30c0-10-6-16-13-16-6 0-10 4-10 9 0 4 3 7 7 7 3 0 5-2 5-5'/%3E%3Cpath d='M32 30c0-10 6-16 13-16 6 0 10 4 10 9 0 4-3 7-7 7-3 0-5-2-5-5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== Language splash ===== -->
<div id="splash" class="splash">
  <canvas id="splashCanvas"></canvas>
  <div class="splash-inner">
    <div class="ornament-big" aria-hidden="true"></div>
    <h1 class="splash-title">Қазақстанда туған<br>орыс әдебиеті</h1>
    <p class="splash-sub">Русская литература, рождённая в Казахстане</p>
    <p class="splash-q">Тілді таңдаңыз · Выберите язык</p>
    <div class="splash-btns">
      <button class="btn btn-gold" data-pick="kz">Қазақша</button>
      <button class="btn btn-gold" data-pick="ru">Русский</button>
    </div>
    <p class="splash-note" data-i="splashNote">🎧 Дыбысты қосыңыз · Включите звук</p>
  </div>
</div>

<!-- ===== Header ===== -->
<header class="topbar" id="topbar">
  <a href="#hero" class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text" data-i="brand"></span>
  </a>
  <nav class="nav" id="nav">
    <a href="#map" data-i="navMap"></a>
    <a href="#writers" data-i="navWriters"></a>
    <a href="#museum" data-i="navMuseum"></a>
    <a href="#games" data-i="navGames"></a>
    <a href="#values" data-i="navValues"></a>
    <a href="#author" data-i="navAuthor"></a>
  </nav>
  <div class="top-actions">
    <button class="icon-btn" id="voiceBtn" title="Озвучка" aria-label="Voice">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    </button>
    <button class="icon-btn" id="musicBtn" title="Music" aria-label="Music">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M9 18.5A2.5 2.5 0 1 1 6.5 16c.17 0 .34.02.5.05V5.5l12-2.5v12a2.5 2.5 0 1 1-2-2.45V7.1l-8 1.7v9.7z"/></svg>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <div class="lang-switch" role="group" aria-label="Language">
      <button data-lang="kz">ҚАЗ</button><button data-lang="ru">РУС</button>
    </div>
    <button class="icon-btn burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<main>
<!-- ===== Hero ===== -->
<section class="hero" id="hero">
  <canvas id="heroCanvas" class="hero-canvas"></canvas>
  <div class="hero-content">
    <p class="eyebrow" data-i="heroEyebrow"></p>
    <h1 class="hero-title" data-i="title"></h1>
    <p class="hero-lead" data-i="heroLead"></p>
    <div class="hero-btns">
      <a href="#map" class="btn btn-gold" data-i="ctaMap"></a>
      <button class="btn btn-ghost" id="openMuseumHero" data-i="ctaMuseum"></button>
    </div>

    <div class="about-card" id="aboutCard">
      <button class="about-toggle" id="aboutToggle" aria-expanded="true">
        <span data-i="aboutTitle"></span>
        <svg class="chev" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
      </button>
      <div class="about-body" id="aboutBody">
        <p id="introText"></p>
        <div class="about-row">
          <button class="btn btn-small btn-audio" id="introAudioBtn"><span class="pi">▶</span> <span data-i="listen"></span></button>
          <ul class="about-features">
            <li data-i="f1"></li><li data-i="f2"></li><li data-i="f3"></li><li data-i="f4"></li><li data-i="f5"></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <a href="#map" class="scroll-hint" aria-label="scroll"><span></span></a>
</section>

<!-- ===== Map (full screen) ===== -->
<section class="map-full" id="map">
  <div class="map-stage" id="mapStage">
    <canvas id="mapCanvas"></canvas>
    <div class="map-labels" id="mapLabels"></div>
    <div class="map-tip" id="mapTip"></div>

    <div class="map-title">
      <p class="eyebrow" data-i="mapEyebrow"></p>
      <h2 data-i="mapTitle"></h2>
      <p class="map-lead" data-i="mapLead"></p>
    </div>

    <div class="map-hud">
      <button class="chip" id="mapTop" data-i="mapTop"></button>
      <button class="chip" id="map3d" data-i="map3d"></button>
      <button class="chip" id="mapSpin" data-i="mapSpin"></button>
      <span class="hud-sep"></span>
      <button class="chip on" data-group="all" data-i="grAll"></button>
      <button class="chip" data-group="ru" data-i="grRu"></button>
      <button class="chip" data-group="rusl" data-i="grRusl"></button>
    </div>

    <div class="map-game-bar" id="mapGameBar" hidden>
      <span id="mapGameQ"></span>
      <span class="score" id="mapGameScore"></span>
      <button class="chip" id="mapGameStop" data-i="stop"></button>
    </div>

    <button class="side-toggle" id="sideToggle" aria-expanded="true">
      <span class="st-ico">☰</span> <span data-i="mapList"></span> <span class="st-chev">›</span>
    </button>
    <aside class="map-side" id="mapSide">
      <ol class="writer-list" id="writerList"></ol>
      <button class="btn btn-ghost btn-block" id="mapGameBtn" data-i="mapGame"></button>
    </aside>

    <div class="time-bar" id="timeBar">
      <button class="tb-play" id="tbPlay" aria-label="play">▶</button>
      <div class="tb-main">
        <div class="tb-top">
          <span class="tb-year" id="tbYear">—</span>
          <span class="tb-era" id="tbEra"></span>
          <span class="tb-event" id="tbEvent"></span>
          <button class="chip tb-all on" id="tbAll" data-i="allTime"></button>
        </div>
        <div class="tb-track">
          <div class="tb-eras" id="tbEras"></div>
          <div class="tb-marks" id="tbMarks"></div>
          <input type="range" id="tbRange" min="1799" max="2026" value="2026" step="1" aria-label="year">
        </div>
      </div>
    </div>

    <div class="map-loading" id="mapLoading" data-i="loading3d"></div>
  </div>
</section>

<!-- time travel overlay -->
<div class="travel" id="travel" hidden>
  <div class="travel-rings"></div>
  <div class="travel-inner">
    <p class="travel-to" data-i="travelTo"></p>
    <div class="travel-year" id="travelYear">1833</div>
    <p class="travel-place" id="travelPlace"></p>
    <p class="travel-era" id="travelEra"></p>
  </div>
</div>

<!-- ===== Timeline ===== -->
<section class="section section-tight" id="timeline">
  <div class="section-head">
    <p class="eyebrow" data-i="tlEyebrow"></p>
    <h2 data-i="tlTitle"></h2>
  </div>
  <div class="timeline" id="timelineBox"></div>
</section>

<!-- ===== Writers ===== -->
<section class="section" id="writers">
  <div class="section-head">
    <p class="eyebrow" data-i="wrEyebrow"></p>
    <h2 data-i="wrTitle"></h2>
    <p class="section-lead" data-i="wrLead"></p>
  </div>
  <div class="cards" id="cards"></div>
</section>

<!-- ===== Museum ===== -->
<section class="section museum-sec" id="museum">
  <div class="museum-promo">
    <div class="museum-text">
      <p class="eyebrow" data-i="muEyebrow"></p>
      <h2 data-i="muTitle"></h2>
      <p class="section-lead" data-i="muLead"></p>
      <ul class="howto">
        <li><kbd>W A S D</kbd> / <kbd>← ↑ → ↓</kbd> <span data-i="muKeys"></span></li>
        <li><kbd>🖱</kbd> <span data-i="muMouse"></span></li>
        <li><kbd>👆</kbd> <span data-i="muTouch"></span></li>
      </ul>
      <button class="btn btn-gold" id="openMuseum" data-i="muEnter"></button>
    </div>
    <div class="museum-preview" aria-hidden="true">
      <div class="mp-frames" id="mpFrames"></div>
    </div>
  </div>
</section>

<!-- ===== Games ===== -->
<section class="section" id="games">
  <div class="section-head">
    <p class="eyebrow" data-i="gmEyebrow"></p>
    <h2 data-i="gmTitle"></h2>
    <p class="section-lead" data-i="gmLead"></p>
  </div>
  <div class="games">
    <article class="game-card">
      <div class="game-ico">🗺️</div>
      <h3 data-i="g1t"></h3><p data-i="g1d"></p>
      <button class="btn btn-ghost" id="gMap" data-i="play"></button>
    </article>
    <article class="game-card">
      <div class="game-ico">📚</div>
      <h3 data-i="g2t"></h3><p data-i="g2d"></p>
      <button class="btn btn-ghost" id="gQuiz" data-i="play"></button>
    </article>
    <article class="game-card">
      <div class="game-ico">🖋️</div>
      <h3 data-i="g3t"></h3><p data-i="g3d"></p>
      <button class="btn btn-ghost" id="gMatch" data-i="play"></button>
    </article>
  </div>
</section>

<!-- ===== Values ===== -->
<section class="section values-sec" id="values">
  <div class="section-head">
    <p class="eyebrow" data-i="vaEyebrow"></p>
    <h2 data-i="vaTitle"></h2>
    <p class="section-lead" data-i="vaLead"></p>
  </div>
  <div class="values" id="valuesBox"></div>
</section>

<!-- ===== Author ===== -->
<section class="section" id="author">
  <div class="author-card">
    <div class="author-photo"><img src="assets/img/author.jpg" alt="" id="authorImg"></div>
    <div class="author-info">
      <p class="eyebrow" data-i="auEyebrow"></p>
      <h2 id="authorName"></h2>
      <p class="author-role" id="authorRole"></p>
      <p class="author-school" id="authorSchool"></p>
      <p id="authorText"></p>
      <div class="author-tags" id="authorTags"></div>
    </div>
  </div>
</section>
</main>

<footer class="footer">
  <div class="ornament-line" aria-hidden="true"></div>
  <p data-i="footer"></p>
  <p class="small" data-i="credits"></p>
</footer>

<!-- ===== Writer modal ===== -->
<div class="modal" id="writerModal" hidden>
  <div class="modal-box">
    <header class="modal-head">
      <img class="modal-ava" id="mAva" alt="">
      <div class="modal-title">
        <h2 id="mName"></h2>
        <p id="mMeta"></p>
      </div>
      <button class="icon-btn close" data-close aria-label="Close">✕</button>
    </header>
    <nav class="tabs" id="mTabs">
      <button data-tab="about" data-i="tAbout"></button>
      <button data-tab="room" data-i="tRoom"></button>
      <button data-tab="trailer" data-i="tTrailer"></button>
      <button data-tab="sim" data-i="tSim"></button>
      <button data-tab="quiz" data-i="tQuiz"></button>
    </nav>
    <div class="modal-body">
      <section class="tab" data-pane="about" id="paneAbout"></section>
      <section class="tab" data-pane="room">
        <div class="room-stage" id="roomStage">
          <canvas id="roomCanvas"></canvas>
          <div class="room-tip" id="roomTip"></div>
          <div class="room-hint" data-i="roomHint"></div>
          <div class="room-info" id="roomInfo" hidden></div>
        </div>
      </section>
      <section class="tab" data-pane="trailer">
        <div class="trailer" id="trailerBox">
          <canvas id="trailerCanvas" width="1280" height="720"></canvas>
          <div class="trailer-cap" id="trailerCap"></div>
          <div class="trailer-ctrl">
            <button class="btn btn-gold btn-small" id="trPlay">▶ <span data-i="trPlay"></span></button>
            <div class="tr-progress"><i id="trBar"></i></div>
            <button class="icon-btn" id="trFull" aria-label="Fullscreen">⛶</button>
          </div>
        </div>
      </section>
      <section class="tab" data-pane="sim" id="paneSim"></section>
      <section class="tab" data-pane="quiz" id="paneQuiz"></section>
    </div>
  </div>
</div>

<!-- ===== Museum fullscreen ===== -->
<div class="museum-full" id="museumFull" hidden>
  <canvas id="museumCanvas"></canvas>
  <div class="mu-cross" aria-hidden="true"></div>
  <div class="mu-tip" id="muTip"></div>
  <div class="mu-top">
    <span class="mu-title" data-i="muTitle"></span>
    <button class="btn btn-small btn-ghost" id="muExit">✕ <span data-i="exit"></span></button>
  </div>
  <div class="mu-help" id="muHelp" data-i="muHelp"></div>
  <div class="mu-pad" id="muPad">
    <button data-mv="f">▲</button><button data-mv="l">◀</button><button data-mv="b">▼</button><button data-mv="r">▶</button>
  </div>
  <div class="mu-card" id="muCard" hidden></div>
</div>

<!-- ===== Generic dialog (games) ===== -->
<div class="modal" id="gameModal" hidden>
  <div class="modal-box modal-narrow">
    <header class="modal-head">
      <div class="modal-title"><h2 id="gmTitleH"></h2></div>
      <button class="icon-btn close" data-close aria-label="Close">✕</button>
    </header>
    <div class="modal-body" id="gameBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/data-extra.js"></script>
<script src="js/audio-map.js"></script>
<script src="js/voice.js"></script>
<script src="js/portraits.js"></script>
<script src="js/kz-shape.js"></script>
<script src="js/i18n.js"></script>
<script src="js/music.js"></script>
<script src="js/scenes.js"></script>
<script src="js/map3d.js"></script>
<script src="js/room3d.js"></script>
<script src="js/museum3d.js"></script>
<script src="js/app.js"></script>
</body>
</html>
